<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1622"/>
      <stop offset="100%" stop-color="#132840"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <text x="140" y="222" font-family="Helvetica,Arial,sans-serif" font-size="25" letter-spacing="4" fill="#6F9BC0">OVERSEEING AI-GENERATED CODE — WHAT THE RESEARCH SAYS</text>

  <!-- headline -->
  <text x="140" y="330" font-family="Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#FFFFFF">The problem isn’t reviewing better.</text>
  <text x="140" y="422" font-family="Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#F2A65A">It’s deciding what needs a human.</text>

  <rect x="140" y="474" width="132" height="5" fill="#F2A65A"/>

  <!-- three findings -->
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="140" y="556" width="7" height="60" rx="3" fill="#E8703A"/>
    <text x="176" y="584" font-size="34" font-weight="700" fill="#FFFFFF">“Multi-agent” is three different designs</text>
    <text x="176" y="620" font-size="28" fill="#9FBDD4">The intuitive one — models voting — has the weakest evidence behind it.</text>

    <rect x="140" y="672" width="7" height="60" rx="3" fill="#4FC08D"/>
    <text x="176" y="700" font-size="34" font-weight="700" fill="#FFFFFF">Rubber-stamping is the default, not a failure</text>
    <text x="176" y="736" font-size="28" fill="#9FBDD4">Attention decays as work goes on — and familiarity with the tool makes it worse.</text>

    <rect x="140" y="788" width="7" height="60" rx="3" fill="#F2A65A"/>
    <text x="176" y="816" font-size="34" font-weight="700" fill="#FFFFFF">So routing is the whole game</text>
    <text x="176" y="852" font-size="28" fill="#9FBDD4">Deciding what gets scarce human attention — and the least-studied part of the field.</text>
  </g>

  <text x="140" y="944" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#6F9BC0">From a systematic review of 9,518 papers · 72 retained</text>
</svg>
