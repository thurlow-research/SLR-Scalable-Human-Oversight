<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#0E1A26"/>
  <text x="72" y="62" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Two modes of attention. Only one of them is review.</text>
  <text x="72" y="96" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#7FA8C9">Under deadline, with an assistant that is usually right, the cheap one wins.</text>

  <!-- SYSTEM 1 -->
  <rect x="72" y="120" width="500" height="340" rx="10" fill="#152736" stroke="#24384A"/>
  <text x="98" y="164" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#E8703A">SYSTEM 1 — fast, heuristic, cheap</text>
  <text x="98" y="196" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#9FBDD4">Skimming for anything obviously broken</text>
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="98" y="220" width="448" height="42" rx="4" fill="#2A3B4B"/>
    <text x="118" y="247" font-size="17" fill="#D9E7F1">“Does this look right?”</text>
    <rect x="98" y="272" width="448" height="42" rx="4" fill="#2A3B4B"/>
    <text x="118" y="299" font-size="17" fill="#D9E7F1">Attention lands on the <tspan font-weight="700" fill="#F7CB98">happy path</tspan></text>
  </g>
  <line x1="98" y1="342" x2="546" y2="342" stroke="#24384A"/>
  <text x="98" y="374" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#9FBDD4">Cost: seconds.  Coverage: the case the</text>
  <text x="98" y="398" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#9FBDD4">author already thought about.</text>
  <text x="98" y="436" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#E8703A">This is the default. Not a failure of discipline.</text>

  <!-- SYSTEM 2 -->
  <rect x="628" y="120" width="500" height="340" rx="10" fill="#152736" stroke="#4FC08D"/>
  <text x="654" y="164" font-family="Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#4FC08D">SYSTEM 2 — analytical, expensive</text>
  <text x="654" y="196" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#9FBDD4">Actually reviewing the change</text>
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="654" y="220" width="448" height="42" rx="4" fill="#1E4A3A" stroke="#357A5B"/>
    <text x="674" y="247" font-size="17" fill="#9FE3C4">“What did this assume, and what breaks it?”</text>
    <rect x="654" y="272" width="448" height="42" rx="4" fill="#1E4A3A" stroke="#357A5B"/>
    <text x="674" y="299" font-size="17" fill="#9FE3C4">Edge cases · failure modes · the reasoning</text>
  </g>
  <line x1="654" y1="342" x2="1102" y2="342" stroke="#24384A"/>
  <text x="654" y="374" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#9FBDD4">Cost: real time and focus.  Coverage: the</text>
  <text x="654" y="398" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#9FBDD4">cases nobody mentioned.</text>
  <text x="654" y="436" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#4FC08D">This is what “a human reviewed it” implies.</text>

  <!-- decay + routing band -->
  <rect x="72" y="482" width="1056" height="122" rx="10" fill="#101E2C" stroke="#3D6FA0" stroke-dasharray="6 4"/>
  <text x="96" y="516" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#7FB2E0">AND THE DEFAULT DECAYS</text>
  <text x="96" y="546" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#9FBDD4">Engagement declined as the task went on — and prior experience with the assistant pushed engineers <tspan font-weight="700" fill="#D9E7F1">further into System 1</tspan>.</text>
  <text x="96" y="574" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#9FBDD4">The longer a team uses the tool, the cheaper its reading of the output gets.</text>

  <text x="600" y="648" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#F2A65A" text-anchor="middle">You can’t run System 2 on everything — so something has to decide what gets it.</text>
</svg>
