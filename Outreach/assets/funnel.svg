<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#0E1A26"/>
  <text x="72" y="86" font-family="Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Screening the literature on AI code oversight</text>
  <text x="72" y="128" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#7FA8C9">Five databases · two screening passes · full-text reading of what was left</text>

  <!-- rows: x=72 label, bar starts 470 -->
  <g font-family="Helvetica,Arial,sans-serif">
    <!-- 9518 -->
    <rect x="470" y="180" width="660" height="52" rx="4" fill="#2E5C82"/>
    <text x="450" y="214" font-size="24" fill="#B9D2E6" text-anchor="end">records screened</text>
    <text x="492" y="216" font-size="30" font-weight="700" fill="#FFFFFF">9,518</text>

    <!-- 4061 -->
    <rect x="470" y="256" width="282" height="52" rx="4" fill="#356A94"/>
    <text x="450" y="290" font-size="24" fill="#B9D2E6" text-anchor="end">passed recall screen</text>
    <text x="492" y="292" font-size="30" font-weight="700" fill="#FFFFFF">4,061</text>

    <!-- 983 -->
    <rect x="470" y="332" width="68" height="52" rx="4" fill="#3D7CAD"/>
    <text x="450" y="366" font-size="24" fill="#B9D2E6" text-anchor="end">eligible after precision screen</text>
    <text x="556" y="368" font-size="30" font-weight="700" fill="#FFFFFF">983</text>

    <!-- 147 -->
    <rect x="470" y="408" width="24" height="52" rx="4" fill="#4A93CC"/>
    <text x="450" y="442" font-size="24" fill="#B9D2E6" text-anchor="end">read in full text</text>
    <text x="512" y="444" font-size="30" font-weight="700" fill="#FFFFFF">147</text>

    <!-- 72 -->
    <rect x="470" y="484" width="14" height="52" rx="4" fill="#F2A65A"/>
    <text x="450" y="518" font-size="24" fill="#F2A65A" text-anchor="end" font-weight="700">retained</text>
    <text x="502" y="520" font-size="34" font-weight="700" fill="#F2A65A">72</text>
  </g>

  <line x1="72" y1="576" x2="1128" y2="576" stroke="#24384A" stroke-width="1"/>
  <text x="72" y="616" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#8FB3CE">Half the full-text corpus was cut on close reading — consistently more</text>
  <text x="72" y="646" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#8FB3CE">aggressively than the model panel proposed.</text>
</svg>
